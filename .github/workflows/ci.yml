# Continuous integration for github.com/womat/modbusread.
#
# Actions are pinned to a commit SHA, with the release in a comment: a tag like
# @v7 can be moved to other code, a SHA cannot. dependabot (.github/dependabot.yml)
# proposes updates for them.
#
# setup-go takes the version from go.mod but the newest patch of it (check-latest),
# and the weekly run repeats govulncheck without a change here: an advisory against
# the Go toolchain or a dependency appears between commits, and dependabot does not
# report the toolchain.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same ref supersedes a run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No hardware needed: the integration tests start a Modbus server on a free port.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Test with race detector
        run: make test

  # The same checks as `make lint` locally: gofmt, go fix, go mod tidy, go vet,
  # golangci-lint and govulncheck. The analysers are pinned in the Makefile only.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # govulncheck exits non-zero only when this code calls a vulnerable symbol;
      # advisories that only sit in required modules are reported but do not fail.
      - name: Lint
        run: make lint

      - name: Build
        run: make build
